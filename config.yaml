project:
  name: "NeuroKinematics"
  version: "0.1.0"
  robot_baseline: "kuka_kr6"

dataset:
  seed: 42
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  synthetic_samples: 1000000

model:
  type: "res_mlp"
  input_dim: 15  # 3 (pos) + 6 (6d rot) + 6 (q_t-1)
  output_dim: 12 # 6 joints * 2 (sin, cos)
  hidden_layers: [512, 512, 512, 256]

training:
  batch_size: 1024
  epochs: 100
  learning_rate: 0.001
  loss_weights:
    mse: 1.0
    fk_pos: 1.0
    fk_rot: 1.0
    joint_limit: 0.5

logging:
  level: "INFO"
  dir: "experiments/logs"
