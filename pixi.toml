[workspace]
name = "neurokinematics"
version = "0.1.0"
description = "Reproducible Foundations environment for NeuroKinematics"
authors = ["Arda Tekgöz"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]
requires-pixi = "==0.81.0"

[dependencies]
python = "3.12.*"
numpy = "2.*"
pinocchio = "==4.1.0"
pytest = "8.*"
hatchling = "==1.27.0"

[pypi-dependencies]
neurokinematics = { path = ".", editable = true }
xacro = "==2.1.1"

[tasks]
env-check = "python -m neurokinematics.environment_check"
test-f00 = "python -m pytest -q tests/f0_00"
build-robot-a = "python -m neurokinematics.robot_asset build"
verify-robot-a = "python -m neurokinematics.robot_asset verify --output experiments/F0-01/manifest-verification.json"
test-f01 = "python -m pytest -q tests/f0_01"
fk-inspect = "python -m neurokinematics.kinematics.validation inspect"
test-f02-unit = "python -m pytest -q tests/f0_02 --ignore=tests/f0_02/test_acceptance.py"
validate-fk-small = "python -m neurokinematics.kinematics.validation validate --small"
validate-fk = "python -m neurokinematics.kinematics.validation validate"
test-f02 = "python -m pytest -q tests/f0_02"
inspect-jacobian = "python -m neurokinematics.kinematics.jacobian_validation inspect"
validate-jacobian = "python -m neurokinematics.kinematics.jacobian_validation validate"
validate-metrics = "python -m neurokinematics.kinematics.metric_validation"
test-f03-unit = "python -m pytest -q tests/f0_03 --ignore=tests/f0_03/test_acceptance.py"
test-f03 = "python -m pytest -q tests/f0_03"
generate-f04 = "python -m neurokinematics.data.cli generate --output data/generated/F0-04/manual"
verify-f04 = "python -m neurokinematics.data.cli verify --output data/generated/F0-04/run-a --manifest experiments/F0-04/dataset-manifest.json"
test-f04-unit = "python -m pytest -q tests/f0_04/test_unit.py"
test-f04 = "python -m pytest -q tests/f0_04"
generate-f05 = "python -m neurokinematics.benchmark.cli generate"
verify-f05-queries = "python -m neurokinematics.benchmark.cli verify-queries"
benchmark-f05 = "python -m neurokinematics.benchmark.cli benchmark"
verify-f05-results = "python -m neurokinematics.benchmark.cli verify-results"
summarize-f05 = "python -m neurokinematics.benchmark.cli summarize"
verify-f05-evidence = "python scripts/run_f05_acceptance.py --verify-only"
accept-f05 = "python scripts/run_f05_acceptance.py"
